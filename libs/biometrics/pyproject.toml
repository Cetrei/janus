[project]
name = "janus-biometrics"
version = "0.1.0"
description = "Local face and voice biometric verification for Janus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "onnxruntime",
    "cryptography",
    "pyyaml",
    "janus-config",
    "janus-platform",
]

[project.optional-dependencies]
face = ["opencv-python-headless"]
sensors = ["sounddevice"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv.sources]
janus-config = { path = "../config", editable = true }
janus-platform = { path = "../platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_biometrics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
