[project]
name = "janus-biometrics"
version = "0.1.0"
description = "Local face and voice biometric verification for Janus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "onnxruntime",
    "cryptography",
    "pyyaml",
    "janus-config",
    "janus-platform",
]

[project.optional-dependencies]
face = ["opencv-python-headless"]
# Separado de `face`: opencv-python-headless no tiene soporte de GUI
# (cv2.imshow/waitKey no funcionan, y en Linux muchas builds headless de
# PyPI tampoco traen V4L2 habilitado para captura real), asi que no sirve
# para manual_camera_check.py ni para ningun preview en vivo. `face-gui`
# instala opencv-python (con GUI) en vez de la variante headless -- son
# mutuamente excluyentes, no se deben instalar los dos extras juntos en el
# mismo entorno (pip/uv puede terminar resolviendo cualquiera de los dos
# 'cv2', no ambos). Produccion/CI/tests usan `face`; solo
# manual_camera_check.py necesita `face-gui`.
face-gui = ["opencv-python"]
sensors = ["sounddevice"]
# Resolves spec-18's Open Question ("Frontend de caracteristicas de voz sin
# PyTorch: evaluar speakeronnx ... o kaldi-native-fbank"). sherpa-onnx
# (k2-fsa/Next-gen Kaldi, Apache-2.0) chosen over speakeronnx (single-
# maintainer 0.0.x alpha, unsuitable for a service meant to run
# indefinitely on a Raspberry Pi) and over kaldi-native-fbank alone
# (would only solve the fbank frontend, leaving ONNX inference unresolved).
# sherpa-onnx solves both in one mature package, ships real wheels for
# manylinux2014_x86_64, manylinux2014_aarch64 (Raspberry Pi) and Windows,
# and distributes the wespeaker ResNet34 model spec-18 already chose.
# sherpa-onnx-core is listed explicitly on purpose. sherpa-onnx's own wheels
# declare `Requires-Dist: sherpa-onnx-core==<same version>`, and that package
# is what ships libonnxruntime.so (the extension's RPATH looks for it in
# sherpa_onnx/lib/). uv's universal lock recorded sherpa-onnx with NO
# dependencies (it read the metadata of one distribution that does not
# declare core), so `uv sync` installed sherpa-onnx without it and
# `import sherpa_onnx` failed with "libonnxruntime.so: cannot open shared
# object file". Keep the two versions in lockstep: core is py3-none and
# built per platform (x86_64, aarch64, win_amd64, macosx) for the same
# release, and a mismatched pair fails at load time, not install time.
voice = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv.sources]
janus-config = { path = "../config", editable = true }
janus-platform = { path = "../platform", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_biometrics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
