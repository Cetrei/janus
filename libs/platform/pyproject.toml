[project]
name = "janus-platform"
version = "0.1.0"
description = "Cross-platform OS abstraction layer (Linux/Windows). Zero dependencies on any other Janus package — safe to vendor into unrelated projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
psutil = ["psutil"]
uvloop = ["uvloop; sys_platform != 'win32'"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
