# Model source configuration for janus_biometrics.
#
# Each entry needs exactly one of `url` (downloaded and cached locally) or
# `local_path` (an operator-supplied file, read directly, no network
# access and no redistribution question). `sha256` is mandatory in both
# cases and is verified before the file is ever loaded (see models.py).
#
# yunet, sface, and wespeaker: hashes confirmed by downloading the files
# directly and running sha256sum (not copied from a third-party page) --
# sizes matched spec-18 (YuNet ~232KB, SFace ~38.7MB, WeSpeaker ~25.3MB)
# and the files were confirmed real (not unresolved Git LFS pointers);
# wespeaker was further verified by actually loading it with
# sherpa_onnx.SpeakerEmbeddingExtractor and confirming 256-dim output.

models:
  scrfd:
    # Face detector, SCRFD-10GF variant with 5-point keypoints
    # (scrfd_10g_bnkps.onnx), from InsightFace's antelopev2 model pack
    # (deepinsight/insightface). Added as an opt-in alternative to yunet
    # for better tolerance to head tilt/profile angles -- yunet remains
    # the default detector (no license question, smaller footprint);
    # this entry is only used if local:scrfd is explicitly configured.
    #
    # LICENSE, read explicitly, not assumed clean because it's on
    # HuggingFace: InsightFace's own code is MIT, but the pretrained
    # weights (this file) carry InsightFace's own restriction --
    # "available for non-commercial research purposes only" -- per
    # github.com/deepinsight/insightface's README. This is a use-scope
    # restriction (personal, non-commercial), not a resale restriction.
    # spec-18's "Technical Decisions" section originally rejected
    # InsightFace/SCRFD for this exact reason; the user has since
    # reviewed that reasoning and explicitly accepted the risk for this
    # project (personal use, portfolio, not sold or redistributed as a
    # product) -- see spec-18's "Actualizacion 2026-09-26" note. This is
    # a product decision by the user, not a claim that the license
    # itself changed or is unambiguous.
    #
    # sha256 cross-checked against three independent HuggingFace mirrors
    # of the same antelopev2 pack (Aitrepreneur/insightface,
    # LPDoctor/insightface, lithiumice/insightface), all reporting the
    # identical hash below for scrfd_10g_bnkps.onnx -- not verified by
    # downloading and running sha256sum locally in this session (no
    # shell/network from this agent), so treat this hash as "strongly
    # corroborated by independent third parties" rather than
    # "independently reproduced"; the user should confirm with their own
    # sha256sum after downloading before trusting it in production.
    sha256: "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"
    url: "https://huggingface.co/Aitrepreneur/insightface/resolve/main/models/antelopev2/scrfd_10g_bnkps.onnx"
    license: "Non-commercial research only (InsightFace); user has accepted this risk for personal/portfolio use, see spec-18"

  yunet:
    # Face detector. opencv/opencv_zoo, MIT license.
    sha256: "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
    url: "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
    license: "MIT"

  sface:
    # Face embedding (128-dim). opencv/opencv_zoo, Apache-2.0 license.
    sha256: "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
    url: "https://github.com/opencv/opencv_zoo/raw/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx"
    license: "Apache-2.0"

  minifasnet_v2:
    # Liveness / anti-spoofing, MiniFASNetV2 (2.7_80x80), one half of the
    # ensemble used by Silent-Face-Anti-Spoofing (minivision-ai). Softmax
    # outputs of this model and minifasnet_v1se are averaged before
    # argmax (see providers/sface.py), matching the upstream-recommended
    # setup (same approach LocalAI's own integration uses).
    #
    # minivision-ai only publishes PyTorch .pth weights, never ONNX. This
    # ONNX export is re-hosted by github.com/leandroveronezi/go-onnxface
    # (MIT-licensed code, does not claim authorship of the weights),
    # produced directly against minivision-ai's own published
    # 2.7_80x80_MiniFASNetV2.pth using the upstream repo's own model
    # definition (src/model_lib/MiniFASNet.py), no float16 conversion.
    # Verified in this session: downloaded, sha256 computed locally,
    # onnx.checker.check_model passed, input [1,3,80,80] / output [1,3]
    # confirmed (matches providers/sface.py's existing 80x80 crop and
    # 3-class softmax handling).
    # License: Apache-2.0, inherited from minivision-ai (see NOTICE) --
    # the MIT license on go-onnxface's own code does not relicense the
    # weights it redistributes.
    sha256: "fa2cddb678630906f7b60b0f63b2d31c413ee2ee158b4f3a9b42ea2a6de4309f"
    url: "https://github.com/leandroveronezi/go-onnxface/releases/download/models-v1/minifasnet_v2.onnx"
    license: "Apache-2.0"

  minifasnet_v1se:
    # Liveness / anti-spoofing, MiniFASNetV1SE (4_0_0_80x80), the other
    # half of the ensemble (see minifasnet_v2 above for the shared
    # rationale, source, and verification notes).
    sha256: "2aaf58e4d80295eb767a6275db1ecec9a16b129a3263f45b6eaf4d6c4d5be29b"
    url: "https://github.com/leandroveronezi/go-onnxface/releases/download/models-v1/minifasnet_v1se.onnx"
    license: "Apache-2.0"

  wespeaker:
    # Speaker verification (requisito 9), WeSpeaker ResNet34 (VoxCeleb,
    # English), 256-dim embedding, consumed via sherpa-onnx's
    # SpeakerEmbeddingExtractor (see providers/speaker_wespeaker.py --
    # this resolves spec-18's fbank frontend Open Question, Architect
    # decision 2026-09-27, see AGENT.md).
    #
    # RESOLVED 2026-09-27 (Implementer): downloaded directly from the
    # sherpa-onnx release (not copied from a third-party page), sha256
    # computed locally with sha256sum, and further verified by actually
    # loading it with sherpa_onnx.SpeakerEmbeddingExtractor -- confirmed
    # it produces 256-dim embeddings, matching
    # SherpaWeSpeakerExtractor's own _EXPECTED_EMBEDDING_DIM check. This
    # is a stronger verification than yunet/sface above (hash AND a real
    # functional load), not just a hash match.
    sha256: "5ef208a9da1453335308a6b6f4e6dfbd7e183a38b604de0a57664f45d257fe94"
    url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx"
    license: "CC BY 4.0 (VoxCeleb) -- requires attribution, see NOTICE"
