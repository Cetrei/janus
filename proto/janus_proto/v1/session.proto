syntax = "proto3";

package janus_proto.v1;

import "google/protobuf/timestamp.proto";

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_JANUS_MAIN = 1;
  SESSION_KIND_AGENT_TASK = 2;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_OPEN = 1;
  SESSION_STATUS_CLOSED = 2;
}

enum ParticipantKind {
  PARTICIPANT_KIND_UNSPECIFIED = 0;
  PARTICIPANT_KIND_JANUS = 1;
  PARTICIPANT_KIND_AGENT = 2;
  PARTICIPANT_KIND_USER_LISTENER = 3;
}

message Participant {
  string participant_id = 1;
  ParticipantKind kind = 2;
  string channel_ref = 3;
  google.protobuf.Timestamp joined_at = 4;
  optional google.protobuf.Timestamp left_at = 5;
}

message Session {
  string session_id = 1;
  SessionKind kind = 2;
  string agent_name = 3;
  optional string task_id = 4;
  SessionStatus status = 5;
  uint32 external_listener_count = 6;
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp closed_at = 8;
}
