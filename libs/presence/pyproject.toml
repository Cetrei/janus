[project]
name = "janus-presence"
version = "0.1.0"
description = "Ambient 1:N person identification spoke for Janus (see SPEC.md)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "janus-biometrics",
    "cffi>=1.16",
    "cryptography>=42.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
