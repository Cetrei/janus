[project]
name = "janus-proto"
version = "0.1.0"
description = "Generated protobuf and gRPC code for the Janus semantic model, plus a hand written facade (spec-01)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "protobuf>=5.28.3,<6",
    "grpcio>=1.67.1",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/janus_proto/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
